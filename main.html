<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboarding — EduScroll</title><style>
:root{--bg:#0b1020;--panel:#121a2f;--panel2:#18233d;--text:#f7f9ff;--muted:#9ba8c7;--accent:#7c5cff;--accent2:#26d0ce;--danger:#ff5d73;--border:#293654;--shadow:0 20px 60px #0005}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#1d2550 0,transparent 35%),var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.container{max-width:1180px;margin:auto;padding:24px}.card{background:#121a2fee;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:22px}.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:white;font-weight:700}.btn.secondary{background:var(--panel2)}.btn.ghost{background:transparent;border:1px solid var(--border)}.btn.danger{background:var(--danger)}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:.82rem;color:var(--muted)}.logo{font-size:1.45rem;font-weight:900;letter-spacing:-.04em}.logo span{color:#9c88ff}
.nav{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#0d1427ee;border:1px solid var(--border);backdrop-filter:blur(18px);border-radius:22px}.nav a{color:var(--muted);text-decoration:none;padding:11px 16px;border-radius:15px;font-weight:700}.nav a.active,.nav a:hover{color:white;background:var(--panel2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.top-actions{display:flex;gap:8px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.hero h1{font-size:clamp(3rem,9vw,7rem);margin:0;letter-spacing:-.07em}.hero p{max-width:650px;margin:18px auto;color:var(--muted);font-size:1.1rem}.loader{width:42px;height:42px;border:4px solid #ffffff20;border-top-color:#9c88ff;border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}@keyframes spin{to{transform:rotate(360deg)}}
.form{display:grid;gap:13px}.form label{font-weight:700;font-size:.9rem}.form input,.form textarea,.form select{width:100%;background:#0d1427;border:1px solid var(--border);color:white;border-radius:13px;padding:13px;outline:none}.form input:focus,.form textarea:focus{border-color:#8b78ff}.auth{max-width:480px;margin:7vh auto}.tabs{display:flex;background:#0d1427;border-radius:14px;padding:5px;margin-bottom:20px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;font-weight:800}.tabs button.active{background:var(--panel2);color:white}.oauth{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--border);flex:1}
.chips{display:flex;gap:9px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 14px}.chip.active{background:var(--accent);color:white;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.choice{padding:18px;border:1px solid var(--border);background:var(--panel);border-radius:18px;text-align:left;color:white}.choice.selected{border-color:#9b89ff;background:#211b46}.choice .emoji{font-size:2rem}.choice strong{display:block;margin-top:8px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.progress{height:7px;background:#202a45;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}
.feed-wrap{height:calc(100vh - 150px);min-height:500px}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;display:flex;flex-direction:column;gap:14px}.post{min-height:calc(100vh - 210px);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.post .cover{height:280px;border-radius:18px;background:linear-gradient(135deg,#282053,#123f50);display:grid;place-items:center;font-size:6rem;margin-bottom:18px}.post h2{font-size:clamp(1.8rem,4vw,3rem);margin:8px 0}.post p{font-size:1.05rem;line-height:1.7;color:#d6dcf0}.post-actions{display:flex;gap:9px;flex-wrap:wrap}.post-actions button{border:1px solid var(--border);background:var(--panel);color:white;border-radius:12px;padding:9px 13px}.quiz{background:#0d1427;border:1px solid var(--border);border-radius:17px;padding:15px;margin-top:12px}.quiz button{margin:5px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:white}.feedback{font-weight:800;margin-top:8px}
.section{margin-bottom:24px}.section h2{margin-bottom:10px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}.stat b{font-size:1.8rem;display:block}.group-card,.notebook{min-height:180px}.group-card h3,.notebook h3{margin-bottom:5px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-bottom:1px solid var(--border)}
.modal{position:fixed;inset:0;background:#0009;z-index:100;display:grid;place-items:center;padding:20px}.modal>div{max-width:520px;width:100%}.note-toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:15px}.note-toolbar button{border:1px solid var(--border);background:var(--panel2);color:white;padding:9px;border-radius:9px}.paper{background:#fff;color:#20243a;border-radius:15px;min-height:600px;padding:30px;margin-top:12px;box-shadow:0 20px 60px #0006}.paper[contenteditable]{outline:none}.paper.gridpaper{background-image:linear-gradient(#d8dce8 1px,transparent 1px),linear-gradient(90deg,#d8dce8 1px,transparent 1px);background-size:24px 24px}.paper.lines{background-image:linear-gradient(transparent 31px,#d8dce8 32px);background-size:100% 32px}.timer{font-size:4rem;font-weight:900;text-align:center;margin:15px}.switch{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid var(--border);border-radius:15px}.switch input{width:22px;height:22px}
.admin-grid{display:grid;grid-template-columns:220px 1fr;gap:16px}.side{align-self:start;position:sticky;top:20px}.side button{width:100%;margin-bottom:7px;text-align:left;background:transparent;border:0;color:var(--muted);padding:12px;border-radius:10px}.side button.active,.side button:hover{background:var(--panel2);color:white}
@media(max-width:700px){.container{padding:14px}.nav{width:calc(100% - 20px);justify-content:space-around}.nav a{padding:10px 12px;font-size:.86rem}.statgrid{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.side{position:static}.post{min-height:calc(100vh - 190px)}}
</style></head><body><div class="app"><main class="container"><section class="card" style="max-width:850px;margin:5vh auto">
<div class="top"><div class="logo">Edu<span>Scroll</span></div><span id="stepLabel" class="tiny"></span></div>
<div class="progress"><i id="bar" style="width:25%"></i></div>
<div id="screen"></div><div class="actions"><button id="back" class="btn ghost">Back</button><button id="next" class="btn">Next</button></div>
</section></main>
<div id="modal" class="modal hidden"><div class="card"><div class="top"><h3>Add language</h3><button id="close" class="btn ghost">✕</button></div><form id="langForm" class="form"><label>Language<input id="newLang" required></label><button class="btn">Submit</button></form></div></div></div>
<script>
const SUPABASE_URL = localStorage.getItem('EDUSCROLL_SUPABASE_URL') || '';
const SUPABASE_ANON_KEY = localStorage.getItem('EDUSCROLL_SUPABASE_ANON_KEY') || '';
let sb = null;
async function loadSupabase(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  if(window.supabase) return sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(s);
  await new Promise(r=>s.onload=r);
  return sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
}
function demoUser(){return JSON.parse(localStorage.getItem('eduscroll_user')||'null')}
function saveUser(u){localStorage.setItem('eduscroll_user',JSON.stringify(u))}
async function getUser(){
  if(sb){const {data}=await sb.auth.getUser(); if(data.user)return data.user}
  return demoUser();
}
function initials(name){return (name||'U').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function go(p){location.href=p}
function toast(msg){const x=document.createElement('div');x.textContent=msg;x.style='position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;background:#18233d;color:white;border:1px solid #405073;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px #0008';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}

let user=demoUser()||{username:'Demo',email:'demo@example.com'},step=0;
const data={language:user.language||'English',school:user.school||{},hobbies:user.hobbies||[],sports:user.sports||[]};
const steps=['Language','Study','Hobbies','Sports','Done']; const screen=document.getElementById('screen');
function render(){document.getElementById('stepLabel').textContent=`${step+1} / ${steps.length}`;document.getElementById('bar').style.width=((step+1)/steps.length*100)+'%';
 if(step===0)screen.innerHTML=`<h1>Choose your language</h1><p class="muted">EduScroll starts in English. You can request another language.</p><div class="grid">${['Français','English','Slovenčina'].map(x=>`<button class="choice ${data.language===x?'selected':''}" onclick="pickLang('${x}')">🌍<strong>${x}</strong></button>`).join('')}<button class="choice" onclick="openLang()">＋<strong>Add language</strong></button></div>`;
 if(step===1)screen.innerHTML=`<h1>What do you study?</h1><p class="muted">Choose one main study path. Entrance-exam preparation can be added separately.</p><div class="grid">${[['ZŠ','ZŠ'],['SŠ','SŠ'],['VŠ','VŠ'],['Príprava na prijímačky','exam'],['Neštudujem','none']].map(([a,b])=>`<button class="choice ${data.school.type===b?'selected':''}" onclick="schoolType('${b}')">🏫<strong>${a}</strong></button>`).join('')}</div>${data.school.type&& !['exam','none'].includes(data.school.type)?`<div class="form" style="margin-top:15px"><label>Field / odbor<input id="field" value="${data.school.field||''}"></label><label>Year / ročník<input id="year" value="${data.school.year||''}"></label></div>`:''}`;
 if(step===2)screen.innerHTML=`<h1>What are your hobbies?</h1><p class="muted">Select one or more.</p><div class="grid">${[['🎮','Gaming'],['🎵','Music'],['🎨','Drawing'],['📷','Photography'],['📚','Reading'],['💻','Programming'],['🍳','Cooking']].map(([e,x])=>`<button class="choice ${data.hobbies.includes(x)?'selected':''}" onclick="toggle('hobbies','${x}')">${e}<strong>${x}</strong></button>`).join('')}<button class="choice ${data.hobbies.includes('Nemám hobby')?'selected':''}" onclick="toggle('hobbies','Nemám hobby')">🚫<strong>Nemám hobby</strong></button></div>`;
 if(step===3)screen.innerHTML=`<h1>What sports do you like?</h1><p class="muted">Select any that apply.</p><div class="grid">${[['⚽','Football'],['🏀','Basketball'],['🏐','Volleyball'],['🎾','Tennis'],['🏊','Swimming'],['🚴','Cycling'],['🏃','Athletics']].map(([e,x])=>`<button class="choice ${data.sports.includes(x)?'selected':''}" onclick="toggle('sports','${x}')">${e}<strong>${x}</strong></button>`).join('')}<button class="choice ${data.sports.includes('Nešportujem')?'selected':''}" onclick="toggle('sports','Nešportujem')">🚫<strong>Nešportujem</strong></button></div>`;
 if(step===4)screen.innerHTML=`<div style="text-align:center;padding:50px 10px"><div style="font-size:4rem">🎉</div><h1>Congratulations!</h1><p class="muted">We are preparing your personalized plan...</p><div class="loader"></div></div>`;
 document.getElementById('back').style.visibility=step?'visible':'hidden';document.getElementById('next').textContent=step===4?'Finish':'Next';
}
function pickLang(x){data.language=x;render()}
function openLang(){document.getElementById('modal').classList.remove('hidden')}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.add('hidden');
document.getElementById('langForm').onsubmit=e=>{e.preventDefault();data.language=document.getElementById('newLang').value;document.getElementById('modal').classList.add('hidden');toast('Language request saved');render()}
function schoolType(x){data.school={type:x};render()}
function toggle(k,x){if(x==='Nemám hobby'||x==='Nešportujem')data[k]=data[k].includes(x)?[]:[x];else{data[k]=data[k].filter(y=>y!=='Nemám hobby'&&y!=='Nešportujem');data[k].includes(x)?data[k]=data[k].filter(y=>y!==x):data[k].push(x)}render()}
document.getElementById('back').onclick=()=>{if(step)step--;render()}
document.getElementById('next').onclick=async()=>{if(step===1&&data.school.type&&!['exam','none'].includes(data.school.type)){data.school.field=document.getElementById('field')?.value||'';data.school.year=document.getElementById('year')?.value||''}
 if(step<4){step++;render()}else{Object.assign(user,data,{onboarded:true});saveUser(user);setTimeout(()=>go('home.html'),1500)}};
render();</script></body></html>
