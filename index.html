<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080812">

    <title>EduScroll</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 45%, #27235c 0%, #111127 35%, #07070e 75%);
            color: white;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .splash {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: #6c63ff;
            filter: blur(130px);
            opacity: 0.18;

            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                transform: scale(0.85);
                opacity: 0.13;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.23;
            }
        }

        /* Logo */
        .logo-container {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: logoEntrance 1.2s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        .logo-icon {
            width: 92px;
            height: 92px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 27px;

            background:
                linear-gradient(135deg, #7c73ff, #5549df);

            box-shadow:
                0 20px 50px rgba(91, 80, 255, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            font-size: 48px;
            font-weight: 800;

            transform: rotate(-5deg);

            margin-bottom: 25px;

            animation:
                iconFloat 3s ease-in-out 1.2s infinite;
        }

        .logo-icon span {
            transform: rotate(5deg);
        }

        .logo {
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 800;
            letter-spacing: -3px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 10%,
                    #c9c5ff 50%,
                    #8c83ff 100%
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            line-height: 1;
        }

        .tagline {
            margin-top: 15px;

            color: rgba(255, 255, 255, 0.55);

            font-size: 15px;
            letter-spacing: 0.5px;

            opacity: 0;

            animation:
                fadeUp 0.8s ease 0.6s forwards;
        }

        /* Loading indicator */
        .loader-container {
            position: absolute;
            z-index: 2;

            bottom: 70px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;

            opacity: 0;

            animation:
                fadeIn 0.8s ease 1s forwards;
        }

        .loader {
            width: 120px;
            height: 3px;

            overflow: hidden;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.12);
        }

        .loader-progress {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #655cff,
                    #a29cff
                );

            animation: loading 2.7s cubic-bezier(.65, 0, .35, 1) forwards;
        }

        .loading-text {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.35);
        }

        /* Decorative particles */
        .particle {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.45);

            animation:
                particleFloat 5s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            top: 18%;
            left: 17%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 25%;
            right: 15%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            bottom: 28%;
            left: 12%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            bottom: 20%;
            right: 18%;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            top: 12%;
            left: 50%;
            width: 3px;
            height: 3px;
            animation-delay: 1.5s;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.25;
            }

            50% {
                transform: translateY(-20px);
                opacity: 0.8;
            }
        }

        @keyframes logoEntrance {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.9);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes iconFloat {
            0%,
            100% {
                transform: rotate(-5deg) translateY(0);
            }

            50% {
                transform: rotate(-2deg) translateY(-7px);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        /* Small screens */
        @media (max-width: 500px) {
            .logo-icon {
                width: 78px;
                height: 78px;

                border-radius: 23px;

                font-size: 40px;
            }

            .tagline {
                font-size: 13px;
            }

            .loader-container {
                bottom: 50px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <main class="splash">

        <div class="glow"></div>

        <!-- Decorative particles -->
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- EduScroll logo -->
        <div class="logo-container">

            <div class="logo-icon">
                <span>✦</span>
            </div>

            <h1 class="logo">
                EduScroll
            </h1>

            <p class="tagline">
                Learn. Explore. Connect.
            </p>

        </div>

        <!-- Loading -->
        <div class="loader-container">

            <div class="loader">
                <div class="loader-progress"></div>
            </div>

            <span class="loading-text">
                Loading
            </span>

        </div>

    </main>

    <script>
        /*
         * EduScroll
         * index.html
         *
         * Splash screen:
         * - zobrazí logo
         * - počká približne 3 sekundy
         * - presmeruje používateľa na login.html
         */

        const REDIRECT_DELAY = 3000;

        window.addEventListener("load", () => {

            setTimeout(() => {

                window.location.href = "login.html";

            }, REDIRECT_DELAY);

        });
    </script>

</body>
</html>
