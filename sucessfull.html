<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduScroll — Success</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #020407;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }

        /* Blue glow */

        .glow {
            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: #0066ff;

            filter: blur(180px);

            opacity: .13;

            pointer-events: none;

            animation: glow 4s ease-in-out infinite alternate;
        }

        /* Main */

        .container {
            position: relative;

            z-index: 2;

            text-align: center;

            animation: appear .7s ease;
        }

        /* Logo */

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #0066ff,
                    #00aaff
                );

            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 0 35px rgba(0,102,255,.4);

            animation:
                logoPop .6s cubic-bezier(.17,.67,.3,1.4);
        }

        /* Check */

        .check {
            width: 78px;
            height: 78px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border: 2px solid #1477ff;

            color: #3291ff;

            font-size: 36px;

            box-shadow:
                0 0 35px rgba(0,102,255,.25);

            animation:
                checkPop .6s .15s
                cubic-bezier(.17,.67,.3,1.4)
                both;
        }

        /* Text */

        h1 {
            font-size: 32px;

            letter-spacing: -1.3px;

            margin-bottom: 10px;
        }

        h1 span {
            color: #2488ff;
        }

        p {
            color: #6f7c91;

            font-size: 14px;

            margin-bottom: 25px;
        }

        /* Redirect text */

        .redirect {
            color: #3f4d61;

            font-size: 11px;

            animation: fade 1s ease;
        }

        /* Animations */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoPop {
            from {
                opacity: 0;
                transform: scale(.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes checkPop {
            from {
                opacity: 0;
                transform: scale(.4);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glow {
            from {
                transform: scale(.9);
                opacity: .09;
            }

            to {
                transform: scale(1.1);
                opacity: .16;
            }
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 27px;
            }

            .check {
                width: 68px;
                height: 68px;

                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div class="container">

        <div class="logo">
            E
        </div>

        <div class="check">
            ✓
        </div>

        <h1>
            Successfully <span>signed up!</span>
        </h1>

        <p>
            Welcome to EduScroll.
        </p>

        <div class="redirect">
            Taking you to EduScroll...
        </div>

    </div>


    <script>

        /*
         * Redirect to main.html
         * after 3 seconds
         */

        setTimeout(() => {

            window.location.href = "main.html";

        }, 3000);

    </script>

</body>
</html>
