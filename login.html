<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduScroll — Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0, 100, 255, 0.14),
                    transparent 40%
                ),
                #05070b;

            color: white;

            font-family:
                Inter,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;

            font-size: 25px;
            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 28px;
        }

        .logo span {
            color: #1478ff;
        }

        .card {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.015)
                );

            border:
                1px solid rgba(255,255,255,.07);

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 30px 100px rgba(0,0,0,.45),
                0 0 60px rgba(0,80,255,.04);
        }

        .tabs {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            background:
                rgba(255,255,255,.025);

            border-radius: 12px;

            padding: 4px;

            margin-bottom: 28px;
        }

        .tab {
            border: none;

            background: transparent;

            color: #647184;

            padding: 11px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 12px;

            transition: .2s;
        }

        .tab.active {
            background: #1478ff;

            color: white;

            box-shadow:
                0 5px 20px
                rgba(20,120,255,.18);
        }

        h1 {
            font-size: 25px;

            text-align: center;

            letter-spacing: -0.8px;

            margin-bottom: 9px;
        }

        .subtitle {
            text-align: center;

            color: #687588;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;

            color: #a2adbc;

            font-size: 11px;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            height: 47px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.025);

            color: white;

            outline: none;

            padding: 0 14px;

            font-size: 13px;

            transition: .2s;
        }

        input:focus {
            border-color: #1478ff;

            background:
                rgba(20,120,255,.04);

            box-shadow:
                0 0 0 3px
                rgba(20,120,255,.07);
        }

        input::placeholder {
            color: #475364;
        }

        .primary {
            width: 100%;

            height: 47px;

            border: none;

            border-radius: 11px;

            background: #1478ff;

            color: white;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: .2s;
        }

        .primary:hover {
            background: #2583ff;

            box-shadow:
                0 8px 30px
                rgba(20,120,255,.18);
        }

        .primary:disabled {
            opacity: .5;

            cursor: not-allowed;

            box-shadow: none;
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            color: #4e5b6d;

            font-size: 10px;

            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255,255,255,.07);
        }

        .google {
            width: 100%;

            height: 47px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,.09);

            background:
                rgba(255,255,255,.025);

            color: white;

            cursor: pointer;

            font-size: 12px;

            transition: .2s;
        }

        .google:hover {
            background:
                rgba(255,255,255,.05);

            border-color:
                rgba(255,255,255,.15);
        }

        .message {
            display: none;

            margin-top: 17px;

            padding: 12px;

            border-radius: 10px;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;
        }

        .message.error {
            display: block;

            color: #ff7d7d;

            background:
                rgba(255,50,50,.07);

            border:
                1px solid rgba(255,50,50,.12);
        }

        .message.success {
            display: block;

            color: #67d99a;

            background:
                rgba(40,200,120,.07);

            border:
                1px solid rgba(40,200,120,.12);
        }

        .loading {
            display: none;

            text-align: center;

            color: #687588;

            font-size: 11px;

            margin-top: 15px;
        }

        .loading.active {
            display: block;
        }

        .password-note {
            color: #4f5c6d;

            font-size: 9px;

            margin-top: 6px;
        }

        @media(max-width: 480px) {

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Edu<span>Scroll</span>
    </div>

    <div class="card">

        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                class="tab"
                id="signupTab"
                onclick="showSignup()"
            >
                Sign Up
            </button>

        </div>


        <!-- LOGIN -->

        <div
            class="form active"
            id="loginForm"
        >

            <h1>
                Welcome back
            </h1>

            <p class="subtitle">
                Log in to continue learning.
            </p>


            <div class="field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="primary"
                id="loginButton"
                onclick="login()"
            >
                Log in
            </button>


            <div class="divider">
                OR
            </div>


            <button
                class="google"
                onclick="loginWithGoogle()"
            >
                Continue with Google
            </button>

        </div>


        <!-- SIGN UP -->

        <div
            class="form"
            id="signupForm"
        >

            <h1>
                Create account
            </h1>

            <p class="subtitle">
                Create your EduScroll account.
            </p>


            <div class="field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                >

                <div class="password-note">
                    Password must contain at least 6 characters.
                </div>

            </div>


            <button
                class="primary"
                id="signupButton"
                onclick="signup()"
            >
                Create account
            </button>


            <div class="divider">
                OR
            </div>


            <button
                class="google"
                onclick="loginWithGoogle()"
            >
                Continue with Google
            </button>

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <div
            class="loading"
            id="loading"
        >
            Please wait...
        </div>

    </div>

</div>


<script>

    /* ==========================================
       SUPABASE CONFIG
    ========================================== */

    const SUPABASE_URL =
        "https://oqolleianbsgwczjsuif.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_rjBo1Lk7o7fQXqiHIOmw1g_0JXmrwxz";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const message =
        document.getElementById(
            "message"
        );

    const loading =
        document.getElementById(
            "loading"
        );


    /* ==========================================
       MESSAGES
    ========================================== */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "message";
    }


    function setLoading(
        state
    ) {

        if (state) {
            loading.classList.add(
                "active"
            );
        } else {
            loading.classList.remove(
                "active"
            );
        }
    }


    /* ==========================================
       TABS
    ========================================== */

    function showLogin() {

        clearMessage();

        document
            .getElementById(
                "loginForm"
            )
            .classList.add("active");

        document
            .getElementById(
                "signupForm"
            )
            .classList.remove("active");


        document
            .getElementById(
                "loginTab"
            )
            .classList.add("active");

        document
            .getElementById(
                "signupTab"
            )
            .classList.remove("active");
    }


    function showSignup() {

        clearMessage();

        document
            .getElementById(
                "signupForm"
            )
            .classList.add("active");

        document
            .getElementById(
                "loginForm"
            )
            .classList.remove("active");


        document
            .getElementById(
                "signupTab"
            )
            .classList.add("active");

        document
            .getElementById(
                "loginTab"
            )
            .classList.remove("active");
    }


    /* ==========================================
       FIND WHERE USER SHOULD GO
    ========================================== */

    async function redirectUser(
        user
    ) {

        setLoading(true);


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "language"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "Profile error:",
                    error
                );

                /*
                 * If the profile doesn't exist,
                 * send the user through onboarding.
                 */

                window.location.href =
                    "main.html";

                return;
            }


            /*
             * No profile = new user.
             */

            if (!data) {

                window.location.href =
                    "main.html";

                return;
            }


            /*
             * Language is filled after
             * onboarding.
             */

            if (!data.language) {

                window.location.href =
                    "main.html";

                return;
            }


            /*
             * User already completed
             * onboarding.
             */

            window.location.href =
                "home.html";

        }

        catch (error) {

            console.error(error);

            window.location.href =
                "main.html";
        }
    }


    /* ==========================================
       LOGIN
    ========================================== */

    async function login() {

        clearMessage();


        const email =
            document
                .getElementById(
                    "loginEmail"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        setLoading(true);


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


        if (error) {

            setLoading(false);

            console.error(error);


            if (
                error.message
                    .toLowerCase()
                    .includes("email not confirmed")
            ) {

                showMessage(
                    "Please confirm your email before logging in."
                );

            } else {

                showMessage(
                    error.message
                );
            }

            return;
        }


        if (!data.user) {

            setLoading(false);

            showMessage(
                "Login failed."
            );

            return;
        }


        await redirectUser(
            data.user
        );
    }


    /* ==========================================
       SIGN UP
    ========================================== */

    async function signup() {

        clearMessage();


        const email =
            document
                .getElementById(
                    "signupEmail"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "signupPassword"
                )
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;
        }


        setLoading(true);


        const redirectUrl =
            window.location.origin +
            "/main.html";


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signUp({

                    email: email,

                    password: password,

                    options: {
                        emailRedirectTo:
                            redirectUrl
                    }

                });


        if (error) {

            setLoading(false);

            console.error(error);

            showMessage(
                error.message
            );

            return;
        }


        /*
         * If Supabase requires email confirmation,
         * session will be null.
         */

        if (!data.session) {

            setLoading(false);

            showMessage(
                "Account created. Please check your email and confirm your account.",
                "success"
            );

            return;
        }


        /*
         * If email confirmation is disabled,
         * user can go directly to onboarding.
         */

        await redirectUser(
            data.user
        );
    }


    /* ==========================================
       GOOGLE LOGIN
    ========================================== */

    async function loginWithGoogle() {

        clearMessage();

        setLoading(true);


        const redirectUrl =
            window.location.origin +
            "/login.html";


        const {
            error
        } =
            await supabaseClient
                .auth
                .signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            redirectUrl

                    }

                });


        if (error) {

            setLoading(false);

            console.error(error);

            showMessage(
                error.message
            );
        }
    }


    /* ==========================================
       CHECK EXISTING SESSION
    ========================================== */

    async function checkSession() {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (error) {

            console.error(error);

            return;
        }


        if (
            data.session &&
            data.session.user
        ) {

            await redirectUser(
                data.session.user
            );
        }
    }


    /* ==========================================
       AUTH STATE
    ========================================== */

    supabaseClient
        .auth
        .onAuthStateChange(
            async (
                event,
                session
            ) => {

                if (
                    (
                        event ===
                        "SIGNED_IN"
                    ) &&
                    session &&
                    session.user
                ) {

                    /*
                     * Small delay prevents
                     * race conditions after
                     * OAuth redirect.
                     */

                    setTimeout(
                        () => {

                            redirectUser(
                                session.user
                            );

                        },
                        300
                    );
                }

            }
        );


    /* ==========================================
       START
    ========================================== */

    checkSession();

</script>

</body>
</html>
